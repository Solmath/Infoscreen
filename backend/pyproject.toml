[project]
name = "infoscreen"
version = "0.2.0"
description = "Self-hosted departure board for EFA-based public transport APIs"
requires-python = ">= 3.14,<4.0"
dependencies = [
    "flask (>=3.1.0,<4.0.0)",
    "httpx>=0.28.1",
    "python-dotenv>=1.2.2",
    "tzdata>=2026.3",
    "waitress>=3.0.2",
]

[dependency-groups]
dev = ["ruff", "pre-commit", "pytest", "respx"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.ruff]
target-version = "py314"
line-length = 88

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "C4", "SIM", "UP"]
ignore = ["E501"]

[build-system]
requires = ["uv_build>=0.12.1,<0.13"]
build-backend = "uv_build"
