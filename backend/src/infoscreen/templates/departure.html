{% extends 'base.html' %} {% block header %}
<h1>{% block title %}Departures{% endblock %}</h1>
{% endblock %} {% block content %}
<div
  x-data='departureBoard({{ stations|tojson }}, {{ url_for("departure.departure_table")|tojson }})'
>
  <label for="station-select">Select Station:</label>
  <select id="station-select" x-model="station" @change="onStationChange()">
    <template x-for="s in stations" :key="s">
      <option :value="s" x-text="s"></option>
    </template>
  </select>
  <div id="departure_tables" x-html="tableHtml"></div>
  <div class="poll-status">
    <div class="poll-status-bar" :style="`width: ${pollPercent}%`"></div>
    <span x-text="`Next update in ${pollSecondsRemaining}s`"></span>
  </div>
</div>
{% endblock %} {% block script %}
<script
  defer
  src="{{ url_for('static', filename='js/alpine.min.js') }}"
></script>
<script>
  // countdown ticks client-side between polls using each row's data-departure-ts
  const STATION_STORAGE_KEY = 'infoscreen:selectedStation';
  const POLL_INTERVAL_MS = 120000;
  const TICK_INTERVAL_MS = 1000;

  function departureBoard(stations, tableUrl) {
    return {
      stations,
      station: stations[0] ?? '',
      tableHtml: '',
      nextPollAt: Date.now() + POLL_INTERVAL_MS,
      pollSecondsRemaining: Math.round(POLL_INTERVAL_MS / 1000),
      pollPercent: 100,
      init() {
        const stored = localStorage.getItem(STATION_STORAGE_KEY);
        if (stored && this.stations.includes(stored)) {
          this.station = stored;
        }
        this.load();
        setInterval(() => this.load(), POLL_INTERVAL_MS);
        setInterval(() => this.tick(), TICK_INTERVAL_MS);
      },
      onStationChange() {
        localStorage.setItem(STATION_STORAGE_KEY, this.station);
        this.load();
      },
      async load() {
        const url = `${tableUrl}?${new URLSearchParams({ station: this.station })}`;
        const response = await fetch(url);
        this.tableHtml = await response.text();
        this.nextPollAt = Date.now() + POLL_INTERVAL_MS;
      },
      tick() {
        this.$el.querySelectorAll('[data-departure-ts]').forEach((el) => {
          const ts = Date.parse(el.dataset.departureTs);
          if (Number.isNaN(ts)) return;
          el.textContent = Math.max(0, Math.round((ts - Date.now()) / 60000));
        });

        const msRemaining = Math.max(0, this.nextPollAt - Date.now());
        this.pollSecondsRemaining = Math.ceil(msRemaining / 1000);
        this.pollPercent = (msRemaining / POLL_INTERVAL_MS) * 100;
      },
    };
  }
</script>
{% endblock %}
