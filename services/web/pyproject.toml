[project]
name = "infoscreen"
version = "0.1.0"
description = "Infoscreen for VVS departures using EFA API"
requires-python = ">= 3.12,<4.0"
dependencies = [
    "flask[async] (>=3.1.0,<4.0.0)", "aiohttp", "tzdata"
]

[dependency-groups]
dev = ["ruff", "pre-commit"]

[build-system]
requires = ["flit_core<4"]
build-backend = "flit_core.buildapi"
