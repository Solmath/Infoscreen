[project]
name = "infoscreen"
version = "0.1.0"
description = "Self-hosted departure board for EFA-based public transport APIs"
requires-python = ">= 3.12,<4.0"
dependencies = [
    "flask (>=3.1.0,<4.0.0)", "httpx", "tzdata", "waitress"
]

[dependency-groups]
dev = ["ruff", "pre-commit", "pytest", "respx"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.ruff]
target-version = "py312"
line-length = 88

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "C4", "SIM", "UP"]
ignore = ["E501"]

[build-system]
requires = ["flit_core<4"]
build-backend = "flit_core.buildapi"
